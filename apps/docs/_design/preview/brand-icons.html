<!doctype html>
<html><head><meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:20px;font-family:var(--font-sans);color:var(--fg-1);}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;}
  .icon{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);background:#fff;border:1px solid var(--border-2);}
  .icon svg{width:22px;height:22px;stroke:var(--fg-1);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .note{font-size:12px;color:var(--fg-3);margin-top:10px;font-family:var(--font-mono);}
</style></head><body>
<div class="grid">
  <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 7l9 6 9-6M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"/><path d="M3 7l9-4 9 4"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></div>
</div>
<div class="note">Lucide · 1.5px stroke · CDN: lucide.dev</div>
</body></html>
