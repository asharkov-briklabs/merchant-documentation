<!doctype html>
<html><head><meta charset="utf-8">
<title>VINR brand mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:20px;font-family:var(--font-sans);}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .tile{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);}
  .lbl{font-size:11px;font-family:var(--font-mono);color:var(--fg-3);text-align:center;margin-top:8px;}
  svg{width:60%;height:60%;}
</style></head><body>
<div class="row">
  <div>
    <div class="tile" style="background:#0b3b45"><img src="../assets/logo-vinr-mark-light.svg" style="width:65%"></div>
    <div class="lbl">light · on teal</div>
  </div>
  <div>
    <div class="tile" style="background:#fff;border:1px solid var(--border-2)"><img src="../assets/logo-vinr-mark-dark.svg" style="width:65%"></div>
    <div class="lbl">dark · on white</div>
  </div>
  <div>
    <div class="tile" style="background:#fafafa;border:1px solid var(--border-2);color:#0b3b45"><img src="../assets/logo-vinr-glyph.svg" style="width:45%;height:auto"></div>
    <div class="lbl">glyph only</div>
  </div>
</div>
</body></html>
