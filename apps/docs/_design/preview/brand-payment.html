<!doctype html>
<html><head><meta charset="utf-8">
<title>Payment methods</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:20px;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tile{background:#fff;border:1px solid var(--border-2);border-radius:var(--radius-md);height:64px;display:flex;align-items:center;justify-content:center;padding:10px;}
  .tile img{max-width:80%;max-height:36px;}
  .lbl{font-size:11px;color:var(--fg-3);text-align:center;margin-top:6px;font-family:var(--font-mono);}
</style></head><body>
<div class="grid">
  <div><div class="tile"><img src="../assets/payment/visa.svg"></div><div class="lbl">visa</div></div>
  <div><div class="tile"><img src="../assets/payment/amex.svg"></div><div class="lbl">amex</div></div>
  <div><div class="tile"><img src="../assets/payment/applepay.svg"></div><div class="lbl">apple pay</div></div>
  <div><div class="tile"><img src="../assets/payment/stripe.svg"></div><div class="lbl">stripe</div></div>
  <div><div class="tile"><img src="../assets/payment/klarna.svg"></div><div class="lbl">klarna</div></div>
  <div><div class="tile"><img src="../assets/payment/affirm.svg"></div><div class="lbl">affirm</div></div>
  <div><div class="tile"><img src="../assets/payment/shoppay.svg"></div><div class="lbl">shop pay</div></div>
  <div><div class="tile"><img src="../assets/payment/bitcoin.svg"></div><div class="lbl">bitcoin</div></div>
</div>
</body></html>
