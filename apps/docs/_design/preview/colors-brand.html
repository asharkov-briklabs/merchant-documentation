<!doctype html>
<html><head><meta charset="utf-8">
<title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:20px;font-family:var(--font-sans);}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{flex:1;min-width:0;border-radius:var(--radius-lg);height:120px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:var(--shadow-xs);}
  .swatch .name{font-weight:600;font-size:13px;line-height:1.2;}
  .swatch .hex{font-family:var(--font-mono);font-size:11px;opacity:.85;margin-top:2px;}
  .label{font-size:11px;font-weight:600;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;}
</style></head><body>
<p class="label">Brand</p>
<div class="row">
  <div class="swatch" style="background:#05191d"><div class="name">teal-900</div><div class="hex">#05191d</div></div>
  <div class="swatch" style="background:#0b3b45"><div class="name">teal-700 · primary</div><div class="hex">#0b3b45</div></div>
  <div class="swatch" style="background:#2a9d90"><div class="name">teal-500</div><div class="hex">#2a9d90</div></div>
  <div class="swatch" style="background:#f7fdfc;color:#0b3b45"><div class="name">teal-50</div><div class="hex">#f7fdfc</div></div>
  <div class="swatch" style="background:#225f47"><div class="name">lime-900</div><div class="hex">#225f47</div></div>
  <div class="swatch" style="background:#0052b4"><div class="name">blue-700</div><div class="hex">#0052b4</div></div>
  <div class="swatch" style="background:#9747ff"><div class="name">accent purple</div><div class="hex">#9747ff</div></div>
  <div class="swatch" style="background:#ffda44;color:#523f03"><div class="name">yellow</div><div class="hex">#ffda44</div></div>
</div>
</body></html>
