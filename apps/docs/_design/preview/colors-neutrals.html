<!doctype html>
<html><head><meta charset="utf-8">
<title>Neutral scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:20px;font-family:var(--font-sans);}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;}
  .chip{height:120px;border-radius:var(--radius-md);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(0,0,0,.05);}
  .chip .n{font-size:10px;font-weight:600;letter-spacing:.04em;}
  .chip .v{font-family:var(--font-mono);font-size:9px;opacity:.8;}
  .label{font-size:11px;font-weight:600;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;}
</style></head><body>
<p class="label">Zinc · neutral scale</p>
<div class="scale">
  <div class="chip" style="background:#fafafa;color:#000"><div class="n">50</div><div class="v">#fafafa</div></div>
  <div class="chip" style="background:#f8f9f9;color:#000"><div class="n">100</div><div class="v">#f8f9f9</div></div>
  <div class="chip" style="background:#f4f6f6;color:#000"><div class="n">200</div><div class="v">#f4f6f6</div></div>
  <div class="chip" style="background:#eff2f2;color:#000"><div class="n">300</div><div class="v">#eff2f2</div></div>
  <div class="chip" style="background:#eceff0;color:#000"><div class="n">400</div><div class="v">#eceff0</div></div>
  <div class="chip" style="background:#e7ebec;color:#000"><div class="n">500</div><div class="v">#e7ebec</div></div>
  <div class="chip" style="background:#d2d6d7;color:#000"><div class="n">600</div><div class="v">#d2d6d7</div></div>
  <div class="chip" style="background:#a4a7a8;color:#000"><div class="n">700</div><div class="v">#a4a7a8</div></div>
  <div class="chip" style="background:#7f8182;color:#fff"><div class="n">800</div><div class="v">#7f8182</div></div>
  <div class="chip" style="background:#616363;color:#fff"><div class="n">900</div><div class="v">#616363</div></div>
  <div class="chip" style="background:#2c2e2e;color:#fff"><div class="n">1000</div><div class="v">#2c2e2e</div></div>
</div>
</body></html>
