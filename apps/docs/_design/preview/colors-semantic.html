<!doctype html>
<html><head><meta charset="utf-8">
<title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:20px;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tile{height:140px;border-radius:var(--radius-lg);padding:14px;border:1px solid rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:space-between;}
  .tile .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .tile .name{font-size:14px;font-weight:600;}
  .tile .hex{font-family:var(--font-mono);font-size:11px;}
  .swbar{height:6px;border-radius:3px;}
</style></head><body>
<div class="grid">
  <div class="tile" style="background:#fee2e2;color:#4d1703;border-color:#fecaca">
    <div><div class="lbl">Destructive</div><div class="name">Error</div></div>
    <div><div class="hex">#d80027</div><div class="swbar" style="background:#d80027;margin-top:8px"></div></div>
  </div>
  <div class="tile" style="background:#fef3c7;color:#523f03;border-color:#fde68a">
    <div><div class="lbl">Warning</div><div class="name">Warn</div></div>
    <div><div class="hex">#ffda44</div><div class="swbar" style="background:#ffda44;margin-top:8px"></div></div>
  </div>
  <div class="tile" style="background:#e7f7f0;color:#01352a;border-color:#c8e8d8">
    <div><div class="lbl">Success</div><div class="name">Lime</div></div>
    <div><div class="hex">#225f47</div><div class="swbar" style="background:#225f47;margin-top:8px"></div></div>
  </div>
  <div class="tile" style="background:#e7f7f7;color:#0b3b45;border-color:#c6e8e8">
    <div><div class="lbl">Info</div><div class="name">Brand</div></div>
    <div><div class="hex">#0b3b45</div><div class="swbar" style="background:#0b3b45;margin-top:8px"></div></div>
  </div>
</div>
</body></html>
