<!doctype html>
<html><head><meta charset="utf-8">
<title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .lbl{width:84px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
  .dot{width:6px;height:6px;border-radius:50%;}
</style></head><body>
<div class="row"><span class="lbl">status</span>
  <span class="badge badge-success"><span class="dot" style="background:#225f47"></span>Paid</span>
  <span class="badge badge-warn"><span class="dot" style="background:#523f03"></span>Pending</span>
  <span class="badge badge-error"><span class="dot" style="background:#4d1703"></span>Failed</span>
  <span class="badge"><span class="dot" style="background:#7f8182"></span>Draft</span>
</div>
<div class="row"><span class="lbl">tag</span>
  <span class="badge badge-brand">Pro</span>
  <span class="badge">Subscription</span>
  <span class="badge">USD</span>
  <span class="badge" style="font-family:var(--font-mono)">cus_3KaYz9</span>
</div>
<div class="row"><span class="lbl">numeric</span>
  <span class="badge" style="background:#0b3b45;color:#fff;border-color:transparent">12</span>
  <span class="badge" style="background:#fff">+24</span>
  <span class="badge badge-success">+12.4%</span>
  <span class="badge badge-error">−3.2%</span>
</div>
</body></html>
