<!doctype html>
<html><head><meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .row:last-child{margin-bottom:0;}
  .lbl{width:84px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
</style></head><body>
<div class="row"><span class="lbl">primary</span>
  <button class="btn btn-primary">Save changes</button>
  <button class="btn btn-primary btn-sm">Add user</button>
  <button class="btn btn-primary btn-lg">Continue</button>
</div>
<div class="row"><span class="lbl">outline</span>
  <button class="btn btn-outline">View docs</button>
  <button class="btn btn-outline btn-sm">Cancel</button>
  <button class="btn btn-outline btn-icon" aria-label="more">⋯</button>
</div>
<div class="row"><span class="lbl">ghost</span>
  <button class="btn btn-ghost">Skip</button>
  <button class="btn btn-ghost btn-sm">Edit</button>
</div>
<div class="row"><span class="lbl">destructive</span>
  <button class="btn btn-destructive">Delete project</button>
  <button class="btn btn-destructive btn-sm">Remove</button>
</div>
</body></html>
