<!doctype html>
<html><head><meta charset="utf-8">
<title>Card · header pattern</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .card{padding:0;}
  .head{padding:20px 24px;border-bottom:1px solid var(--border-2);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .title{font-size:16px;font-weight:600;}
  .desc{font-size:13px;color:var(--fg-3);margin-top:2px;}
  .body{padding:20px 24px;}
  .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
  .row .k{color:var(--fg-3);}
  .row .v{font-family:var(--font-mono);}
</style></head><body>
<div class="card">
  <div class="head">
    <div><div class="title">April invoice</div><div class="desc">Issued Apr 27 · Due May 11</div></div>
    <span class="badge badge-success">Paid</span>
  </div>
  <div class="body">
    <div class="row"><span class="k">Subtotal</span><span class="v">$1,180.00</span></div>
    <div class="row"><span class="k">Tax</span><span class="v">$60.00</span></div>
    <div class="row" style="border-top:1px solid var(--border-2);margin-top:6px;padding-top:10px"><span class="k" style="color:var(--fg-1);font-weight:600">Total</span><span class="v" style="font-weight:600">$1,240.00</span></div>
  </div>
</div>
</body></html>
