<!doctype html>
<html><head><meta charset="utf-8">
<title>Inputs &amp; controls</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:12px;font-weight:500;color:var(--fg-1);}
  .hint{font-size:11px;color:var(--fg-3);}
  /* checkbox */
  .ck{display:inline-flex;align-items:center;gap:8px;font-size:14px;}
  .ck input{appearance:none;width:16px;height:16px;border:1px solid var(--border-1);border-radius:4px;display:inline-grid;place-items:center;background:#fff;cursor:pointer;}
  .ck input:checked{background:var(--vinr-teal-700);border-color:var(--vinr-teal-700);}
  .ck input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px);}
  /* switch */
  .sw{appearance:none;width:36px;height:20px;background:var(--zinc-500);border-radius:9999px;position:relative;cursor:pointer;transition:background .15s;}
  .sw::after{content:"";width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .15s;box-shadow:var(--shadow-sm);}
  .sw:checked{background:var(--vinr-teal-700);}
  .sw:checked::after{transform:translateX(16px);}
</style></head><body>
<div class="row">
  <div class="field" style="width:200px"><label>Email</label><input class="input" placeholder="you@vinr.com" value="leo@vinr.com"></div>
  <div class="field" style="width:140px"><label>Amount</label><input class="input" value="$1,240.00"></div>
  <div class="field"><label>Currency</label><select class="input" style="width:100px"><option>USD</option><option>EUR</option></select></div>
</div>
<div class="row" style="gap:24px">
  <label class="ck"><input type="checkbox" checked> Send receipt</label>
  <label class="ck"><input type="checkbox"> Save card</label>
  <label class="ck" style="gap:10px"><input type="checkbox" class="sw" checked>Auto-charge</label>
  <label class="ck" style="gap:10px"><input type="checkbox" class="sw">Test mode</label>
</div>
</body></html>
