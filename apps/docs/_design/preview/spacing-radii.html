<!doctype html>
<html><head><meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:88px;height:88px;background:var(--vinr-teal-700);}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm</div><div class="v">4 px</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">md</div><div class="v">6 px · default</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">lg</div><div class="v">8 px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="name">xl</div><div class="v">12 px</div></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><div class="name">full</div><div class="v">9999 px</div></div>
</div>
</body></html>
