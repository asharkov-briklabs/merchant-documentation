<!doctype html>
<html><head><meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .row{display:flex;align-items:center;gap:16px;padding:6px 0;}
  .name{width:48px;font-family:var(--font-mono);font-size:12px;color:var(--fg-2);}
  .px{width:48px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:right;}
  .bar{height:12px;background:var(--vinr-teal-700);border-radius:2px;}
</style></head><body>
<div class="row"><div class="name">1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
<div class="row"><div class="name">2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
<div class="row"><div class="name">3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
<div class="row"><div class="name">4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
<div class="row"><div class="name">6</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
<div class="row"><div class="name">8</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
<div class="row"><div class="name">10</div><div class="bar" style="width:40px"></div><div class="px">40 px</div></div>
<div class="row"><div class="name">12</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
<div class="row"><div class="name">16</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
<div class="row"><div class="name">24</div><div class="bar" style="width:96px"></div><div class="px">96 px</div></div>
</body></html>
