<!doctype html>
<html><head><meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:32px;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  .card{height:96px;background:#fff;border-radius:8px;border:1px solid var(--border-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);font-weight:600;}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body>
<div class="grid">
  <div class="card" style="box-shadow:var(--shadow-xs)"><div class="name">xs</div><div class="v">cards</div></div>
  <div class="card" style="box-shadow:var(--shadow-sm)"><div class="name">sm</div><div class="v">popovers</div></div>
  <div class="card" style="box-shadow:var(--shadow-md)"><div class="name">md</div><div class="v">dropdowns</div></div>
  <div class="card" style="box-shadow:var(--shadow-lg)"><div class="name">lg</div><div class="v">dialogs</div></div>
</div>
</body></html>
