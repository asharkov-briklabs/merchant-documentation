<!doctype html>
<html><head><meta charset="utf-8">
<title>Body type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);}
  .row{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border-2);}
  .row:last-child{border-bottom:0;}
  .label{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
  .meta{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head><body>
<div class="row"><div class="label">Lead · 400</div><div style="font-size:20px;line-height:28px;color:var(--fg-2)">Beautifully crafted billing for modern teams.</div><div class="meta">20/28</div></div>
<div class="row"><div class="label">Body lg · 400</div><div style="font-size:16px;line-height:24px">Every charge, refund, and dispute in one place.</div><div class="meta">16/24</div></div>
<div class="row"><div class="label">Body · 400</div><div style="font-size:14px;line-height:20px">A 30-day free trial. No credit card required.</div><div class="meta">14/20</div></div>
<div class="row"><div class="label">Body · 500</div><div style="font-size:14px;line-height:20px;font-weight:500">Active · Customer since Mar 2024</div><div class="meta">14/20</div></div>
<div class="row"><div class="label">Small · 400</div><div style="font-size:12px;line-height:16px;color:var(--fg-3)">Last updated 2 minutes ago</div><div class="meta">12/16</div></div>
</body></html>
