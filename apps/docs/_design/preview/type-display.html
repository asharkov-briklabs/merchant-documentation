<!doctype html>
<html><head><meta charset="utf-8">
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-1);padding:24px;font-family:var(--font-sans);color:var(--fg-1);}
  .row{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border-2);}
  .row:last-child{border-bottom:0;}
  .label{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
  .meta{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);}
</style></head><body>
<div class="row"><div class="label">H1 · 700</div><div style="font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:40px">Manage your projects</div><div class="meta">36/40</div></div>
<div class="row"><div class="label">H2 · 600</div><div style="font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:36px">Active subscriptions</div><div class="meta">30/36</div></div>
<div class="row"><div class="label">H3 · 600</div><div style="font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:32px">Add a payment method</div><div class="meta">24/32</div></div>
<div class="row"><div class="label">H4 · 600</div><div style="font-size:20px;font-weight:600;line-height:28px">Recent invoices</div><div class="meta">20/28</div></div>
</body></html>
