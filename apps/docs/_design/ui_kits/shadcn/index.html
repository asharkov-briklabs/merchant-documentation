<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shadcn-VINR · components</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin:0; background:#fafafa; font-family:'Inter', sans-serif; color:#0b3b45; }
  .page { max-width:1100px; margin:0 auto; padding:48px 32px 80px; }
  .page > header { margin-bottom:48px; }
  .page > header h1 { margin:0; font-size:36px; font-weight:700; letter-spacing:-.02em; }
  .page > header p { margin:8px 0 0; font-size:16px; color:#7f8182; max-width:640px; line-height:1.5; }
  section { margin-top:48px; }
  section > h2 { margin:0 0 4px; font-size:20px; font-weight:600; }
  section > .desc { margin:0 0 20px; font-size:13px; color:#7f8182; }
  .specimen { background:#fff; border:1px solid #f4f6f6; border-radius:8px; padding:24px; box-shadow:0 1px 2px 0 rgba(0,0,0,.04); }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .stack { display:flex; flex-direction:column; gap:12px; }
  .label-mono { font-family:'Roboto Mono', monospace; font-size:11px; color:#7f8182; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>

<script type="text/babel">
function Section({ id, title, desc, children }) {
  return (
    <section data-screen-label={`shadcn/${id}`}>
      <h2>{title}</h2>
      <p className="desc">{desc}</p>
      {children}
    </section>
  );
}

function App() {
  const [tab, setTab] = React.useState('overview');
  const [sw1, setSw1] = React.useState(true);
  const [sw2, setSw2] = React.useState(false);
  const [dlg, setDlg] = React.useState(false);
  const [sel, setSel] = React.useState('usd');

  return (
    <div className="page" data-screen-label="shadcn/index">
      <header>
        <div className="label-mono">VINR · shadcn/ui kit</div>
        <h1>Component library</h1>
        <p>shadcn/ui primitives restyled with VINR brand tokens — teal-700 ink, zinc neutrals, 6 px default radius, Inter throughout. Components below are the most-composed primitives across the Barracuda Merchants product surfaces.</p>
      </header>

      {/* BUTTONS */}
      <Section id="buttons" title="Buttons" desc="Primary surfaces use teal-700; outline and ghost handle secondary actions; destructive is reserved for irreversible deletes.">
        <div className="specimen stack">
          <div>
            <div className="label-mono">Variants</div>
            <div className="row">
              <Button variant="primary">Save changes</Button>
              <Button variant="secondary">Save draft</Button>
              <Button variant="outline">Cancel</Button>
              <Button variant="ghost">Skip</Button>
              <Button variant="destructive">Delete</Button>
              <Button variant="link">View docs →</Button>
            </div>
          </div>
          <div>
            <div className="label-mono">Sizes</div>
            <div className="row">
              <Button size="sm">Small</Button>
              <Button size="md">Medium</Button>
              <Button size="lg">Large</Button>
              <Button size="icon" variant="outline">⌘</Button>
            </div>
          </div>
        </div>
      </Section>

      {/* INPUTS */}
      <Section id="inputs" title="Inputs &amp; controls" desc="Form primitives — Input, Select, Switch — share a 36 px height and 6 px radius for vertical alignment in dense forms.">
        <div className="specimen grid-2">
          <Field label="Email" hint="We'll send receipts here">
            <Input placeholder="you@vinr.com" defaultValue="leo@vinr.com"/>
          </Field>
          <Field label="Card number" error="Card declined — try another method">
            <Input placeholder="1234 5678 9012 3456" defaultValue="4242 4242 4242 4242"/>
          </Field>
          <Field label="Currency">
            <Select value={sel} onChange={setSel} options={[
              {value:'usd', label:'USD · US Dollar'},
              {value:'eur', label:'EUR · Euro'},
              {value:'gbp', label:'GBP · Pound'},
              {value:'jpy', label:'JPY · Yen'},
            ]}/>
          </Field>
          <Field label="Notification settings">
            <div className="stack" style={{gap:8, marginTop:4}}>
              <label style={{display:'flex', alignItems:'center', gap:10, fontSize:13}}>
                <Switch checked={sw1} onChange={setSw1}/> Email me on every charge
              </label>
              <label style={{display:'flex', alignItems:'center', gap:10, fontSize:13}}>
                <Switch checked={sw2} onChange={setSw2}/> Auto-retry failed payments
              </label>
            </div>
          </Field>
        </div>
      </Section>

      {/* TABS */}
      <Section id="tabs" title="Tabs" desc="Segmented switcher used for short, mutually exclusive view toggles.">
        <div className="specimen">
          <Tabs value={tab} onChange={setTab} tabs={[
            {value:'overview', label:'Overview'},
            {value:'activity', label:'Activity'},
            {value:'invoices', label:'Invoices'},
            {value:'settings', label:'Settings'},
          ]}/>
          <div style={{marginTop:16, padding:16, background:'#fafafa', borderRadius:6, fontSize:13, color:'#7f8182'}}>
            Showing <span style={{fontWeight:500, color:'#0b3b45'}}>{tab}</span> tab content.
          </div>
        </div>
      </Section>

      {/* ALERTS / PROGRESS */}
      <Section id="feedback" title="Feedback" desc="Inline alerts and progress indicators. Tone is communicated by color + icon, never emoji.">
        <div className="specimen stack">
          <Alert tone="info" title="Test mode is on">
            Charges made in test mode won't be settled. Toggle off in the topbar before going live.
          </Alert>
          <Alert tone="success" title="Payment received">
            $1,240.00 from Riviera Press cleared on Apr 27.
          </Alert>
          <Alert tone="warn" title="Verify your business">
            Submit your business documents to enable payouts above $10,000.
          </Alert>
          <Alert tone="error" title="Card declined">
            The customer's card was declined for insufficient funds. They've been notified.
          </Alert>
          <div>
            <div className="label-mono">Progress · onboarding 60% complete</div>
            <Progress value={60}/>
          </div>
        </div>
      </Section>

      {/* DISPLAY */}
      <Section id="display" title="Display" desc="Avatars, breadcrumbs, tooltips — small composable pieces that appear in nav chrome and tables.">
        <div className="specimen grid-3">
          <div>
            <div className="label-mono">Avatars</div>
            <div className="row">
              <Avatar initials="LM" size={40}/>
              <Avatar initials="AS" size={32}/>
              <Avatar initials="DK" size={28}/>
              <Avatar initials="YT" size={24}/>
            </div>
          </div>
          <div>
            <div className="label-mono">Tooltips</div>
            <div className="row">
              <Tooltip text="Copy customer ID">
                <Button size="sm" variant="outline">Hover me</Button>
              </Tooltip>
            </div>
          </div>
          <div>
            <div className="label-mono">Breadcrumb</div>
            <Breadcrumb items={['Billing','Invoices','INV-2487']}/>
          </div>
        </div>
      </Section>

      {/* OVERLAY */}
      <Section id="overlay" title="Overlay" desc="Dialogs darken the page with a teal-tinted scrim and lift on shadow-lg.">
        <div className="specimen">
          <Button onClick={()=>setDlg(true)}>Open dialog</Button>
          <Dialog open={dlg} onClose={()=>setDlg(false)}
            title="Delete this customer?"
            description="This will remove Ana Soriano and all 14 of their invoices. This action cannot be undone."
            footer={<>
              <Button variant="outline" onClick={()=>setDlg(false)}>Cancel</Button>
              <Button variant="destructive" onClick={()=>setDlg(false)}>Delete customer</Button>
            </>}
          >
            <Field label="Type DELETE to confirm">
              <Input placeholder="DELETE"/>
            </Field>
          </Dialog>
        </div>
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
