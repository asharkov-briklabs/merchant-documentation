openapi: 3.1.0
info:
  title: VINR API
  version: "2024-11-01"
  description: |
    The VINR API is organized around REST. Our API has predictable resource-oriented URLs,
    accepts JSON-encoded request bodies, returns JSON-encoded responses, and uses standard
    HTTP response codes, authentication, and verbs.

    All API requests must be made over HTTPS. Calls made over plain HTTP will fail.
    API requests without authentication will also fail.

servers:
  - url: https://api.vinr.com/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Payments
    description: Create and manage payments. A payment represents a single charge or authorization to move money from a customer to your account.
  - name: Customers
    description: Create and manage customers. Customers let you save payment methods, track purchase history, and associate subscriptions.
  - name: Payment Methods
    description: Create and manage payment methods. A payment method represents a customer's payment instrument — a card, bank account, or wallet.
  - name: Subscriptions
    description: Create and manage subscriptions. Subscriptions let you charge a customer on a recurring basis.
  - name: Invoices
    description: Create and manage invoices. Invoices are statements of amounts owed by a customer.
  - name: Refunds
    description: Create and manage refunds. Refunds allow you to return some or all of a payment's captured amount.
  - name: Payouts
    description: Create and manage payouts. Payouts move funds from your VINR balance to your bank account.
  - name: Disputes
    description: Manage disputes. A dispute occurs when a customer questions a charge with their card issuer.
  - name: Webhook Endpoints
    description: Manage webhook endpoints. Webhooks notify your server when events happen in your VINR account.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use your secret API key (`sk_live_...` or `sk_test_...`) as a bearer token.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [api_error, authentication_error, card_error, invalid_request_error, rate_limit_error]
              description: The type of error returned.
            code:
              type: string
              description: A short string indicating the error code.
            message:
              type: string
              description: A human-readable message providing more details about the error.
            param:
              type: string
              nullable: true
              description: The parameter the error relates to, if applicable.

    ListMeta:
      type: object
      required: [object, data, has_more, url]
      properties:
        object:
          type: string
          enum: [list]
        has_more:
          type: boolean
          description: Whether there are more items beyond this page.
        url:
          type: string
          description: The URL for this list.

    Payment:
      type: object
      required: [id, object, amount, currency, status, livemode, created]
      properties:
        id:
          type: string
          example: pay_3Nx8a2Lk
          description: Unique identifier for the payment.
        object:
          type: string
          enum: [payment]
        amount:
          type: integer
          description: Amount intended to be collected, in the smallest currency unit (e.g. cents for USD).
          example: 2000
        amount_captured:
          type: integer
          description: Amount that was collected. Equal to `amount` for a non-refunded payment.
          example: 2000
        currency:
          type: string
          description: Three-letter ISO currency code, in lowercase.
          example: usd
        status:
          type: string
          enum: [succeeded, requires_action, requires_capture, processing, failed, canceled]
          description: The status of the payment.
        customer:
          type: string
          nullable: true
          description: ID of the customer this payment is for, if one exists.
          example: cust_8aZ2
        description:
          type: string
          nullable: true
          description: An arbitrary string attached to the object. Often useful for displaying to users.
        payment_method:
          type: string
          nullable: true
          description: ID of the payment method used.
          example: pm_1abc
        capture_method:
          type: string
          enum: [automatic, manual]
          description: Controls when the funds will be captured from the customer's account.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Set of key-value pairs for storing additional structured information.
        receipt_url:
          type: string
          nullable: true
          description: A URL that can be used to view a receipt for this payment.
        livemode:
          type: boolean
          description: Has the value `true` if the object exists in live mode, `false` in test mode.
        created:
          type: integer
          description: Time at which the object was created, as a Unix timestamp.

    Customer:
      type: object
      required: [id, object, livemode, created]
      properties:
        id:
          type: string
          example: cust_8aZ2
          description: Unique identifier for the customer.
        object:
          type: string
          enum: [customer]
        email:
          type: string
          nullable: true
          example: jenny.rosen@example.com
          description: The customer's email address.
        name:
          type: string
          nullable: true
          example: Jenny Rosen
          description: The customer's full name or business name.
        phone:
          type: string
          nullable: true
          description: The customer's phone number.
        description:
          type: string
          nullable: true
          description: An arbitrary string describing the customer.
        default_payment_method:
          type: string
          nullable: true
          description: ID of the default payment method attached to the customer.
        balance:
          type: integer
          description: Current balance, if any, that's been accrued on the customer's account.
        metadata:
          type: object
          additionalProperties:
            type: string
        livemode:
          type: boolean
        created:
          type: integer

    PaymentMethod:
      type: object
      required: [id, object, type, livemode, created]
      properties:
        id:
          type: string
          example: pm_1abc
          description: Unique identifier for the payment method.
        object:
          type: string
          enum: [payment_method]
        type:
          type: string
          enum: [card, bank_transfer, sepa_debit, us_bank_account, wallet]
          description: The type of payment method.
        card:
          type: object
          nullable: true
          description: Details about the card. Only present when `type` is `card`.
          properties:
            brand:
              type: string
              enum: [amex, diners, discover, mastercard, unionpay, visa, unknown]
              example: visa
            last4:
              type: string
              example: "4242"
            exp_month:
              type: integer
              example: 12
            exp_year:
              type: integer
              example: 2026
            funding:
              type: string
              enum: [credit, debit, prepaid, unknown]
            country:
              type: string
              example: US
        customer:
          type: string
          nullable: true
          description: The ID of the customer to which this payment method is saved.
        billing_details:
          type: object
          properties:
            email:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
        livemode:
          type: boolean
        created:
          type: integer

    Subscription:
      type: object
      required: [id, object, customer, status, livemode, created]
      properties:
        id:
          type: string
          example: sub_1Abc
          description: Unique identifier for the subscription.
        object:
          type: string
          enum: [subscription]
        customer:
          type: string
          description: ID of the customer who owns the subscription.
          example: cust_8aZ2
        status:
          type: string
          enum: [active, past_due, canceled, unpaid, incomplete, incomplete_expired, trialing]
          description: The status of the subscription.
        current_period_start:
          type: integer
          description: Start of the current period that the subscription has been invoiced for, as a Unix timestamp.
        current_period_end:
          type: integer
          description: End of the current period that the subscription has been invoiced for, as a Unix timestamp.
        cancel_at_period_end:
          type: boolean
          description: If `true`, the subscription has been canceled but will not expire until the end of the current period.
        canceled_at:
          type: integer
          nullable: true
          description: If the subscription has been canceled, the date of that cancellation.
        trial_start:
          type: integer
          nullable: true
          description: If the subscription has a trial, the beginning of that trial.
        trial_end:
          type: integer
          nullable: true
          description: If the subscription has a trial, the end of that trial.
        items:
          type: object
          description: List of subscription items, each with an attached price.
          properties:
            object:
              type: string
              enum: [list]
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  price:
                    type: string
                  quantity:
                    type: integer
        metadata:
          type: object
          additionalProperties:
            type: string
        livemode:
          type: boolean
        created:
          type: integer

    Invoice:
      type: object
      required: [id, object, customer, status, livemode, created]
      properties:
        id:
          type: string
          example: inv_1Abc
          description: Unique identifier for the invoice.
        object:
          type: string
          enum: [invoice]
        customer:
          type: string
          description: The ID of the customer who will be charged.
          example: cust_8aZ2
        subscription:
          type: string
          nullable: true
          description: The subscription that this invoice was prepared for, if any.
        status:
          type: string
          enum: [draft, open, paid, uncollectible, void]
          description: The status of the invoice, one of `draft`, `open`, `paid`, `uncollectible`, or `void`.
        amount_due:
          type: integer
          description: Final amount due at this time for this invoice.
        amount_paid:
          type: integer
          description: The amount, in the smallest currency unit, that was paid.
        amount_remaining:
          type: integer
          description: The difference between `amount_due` and `amount_paid`.
        currency:
          type: string
          example: usd
        due_date:
          type: integer
          nullable: true
          description: The date on which payment for this invoice is due.
        hosted_invoice_url:
          type: string
          nullable: true
          description: A link to the hosted invoice page.
        invoice_pdf:
          type: string
          nullable: true
          description: A link to the invoice PDF.
        number:
          type: string
          nullable: true
          description: A unique, identifying string that appears on emails sent to the customer.
          example: VINR-0001
        livemode:
          type: boolean
        created:
          type: integer

    Refund:
      type: object
      required: [id, object, amount, currency, payment, status, created]
      properties:
        id:
          type: string
          example: ref_1Abc
          description: Unique identifier for the refund.
        object:
          type: string
          enum: [refund]
        amount:
          type: integer
          description: Amount, in the smallest currency unit, refunded.
        currency:
          type: string
          example: usd
        payment:
          type: string
          description: ID of the payment that was refunded.
          example: pay_3Nx8a2Lk
        reason:
          type: string
          nullable: true
          enum: [duplicate, fraudulent, requested_by_customer]
          description: Reason for the refund.
        status:
          type: string
          enum: [pending, succeeded, failed, canceled]
          description: Status of the refund.
        metadata:
          type: object
          additionalProperties:
            type: string
        created:
          type: integer

    Payout:
      type: object
      required: [id, object, amount, currency, status, created]
      properties:
        id:
          type: string
          example: po_1Abc
          description: Unique identifier for the payout.
        object:
          type: string
          enum: [payout]
        amount:
          type: integer
          description: Amount (in the smallest currency unit) to be transferred to your bank account.
        currency:
          type: string
          example: usd
        arrival_date:
          type: integer
          description: Date the payout is expected to arrive in the bank, as a Unix timestamp.
        status:
          type: string
          enum: [paid, pending, in_transit, canceled, failed]
          description: Current status of the payout.
        method:
          type: string
          enum: [standard, instant]
          description: The method used to send this payout.
        description:
          type: string
          nullable: true
        failure_message:
          type: string
          nullable: true
          description: Message to user further explaining reason for payout failure if available.
        metadata:
          type: object
          additionalProperties:
            type: string
        created:
          type: integer

    Dispute:
      type: object
      required: [id, object, amount, currency, payment, status, created]
      properties:
        id:
          type: string
          example: dp_1Abc
          description: Unique identifier for the dispute.
        object:
          type: string
          enum: [dispute]
        amount:
          type: integer
          description: Disputed amount in the smallest currency unit.
        currency:
          type: string
          example: usd
        payment:
          type: string
          description: ID of the payment that was disputed.
        reason:
          type: string
          enum: [duplicate, fraudulent, subscription_canceled, product_unacceptable, product_not_received, unrecognized, credit_not_processed, general, incorrect_account_details, insufficient_funds, bank_cannot_process, debit_not_authorized, customer_initiated]
          description: Reason given by cardholder for dispute.
        status:
          type: string
          enum: [warning_needs_response, warning_under_review, warning_closed, needs_response, under_review, charge_refunded, won, lost]
          description: Current status of dispute.
        evidence:
          type: object
          description: Evidence to submit to the card network.
          properties:
            customer_email_address:
              type: string
              nullable: true
            customer_name:
              type: string
              nullable: true
            customer_purchase_ip:
              type: string
              nullable: true
            product_description:
              type: string
              nullable: true
            receipt:
              type: string
              nullable: true
            shipping_documentation:
              type: string
              nullable: true
        evidence_due_by:
          type: integer
          nullable: true
          description: Date by which evidence must be submitted in order to successfully challenge dispute.
        created:
          type: integer

    WebhookEndpoint:
      type: object
      required: [id, object, url, enabled_events, status, livemode, created]
      properties:
        id:
          type: string
          example: we_1Abc
          description: Unique identifier for the webhook endpoint.
        object:
          type: string
          enum: [webhook_endpoint]
        url:
          type: string
          description: The URL of the webhook endpoint.
          example: https://example.com/webhooks
        enabled_events:
          type: array
          items:
            type: string
          description: The list of events to enable for this endpoint.
          example: ["payment.succeeded", "payment.failed"]
        status:
          type: string
          enum: [enabled, disabled]
          description: The status of this webhook endpoint.
        description:
          type: string
          nullable: true
        secret:
          type: string
          description: The endpoint's secret, used to generate webhook signatures. Only returned at creation time.
          example: whsec_...
        livemode:
          type: boolean
        created:
          type: integer

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: A limit on the number of objects to be returned, between 1 and 100.
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
      description: A cursor for use in pagination. `starting_after` is an object ID that defines your place in the list.
    EndingBefore:
      name: ending_before
      in: query
      schema:
        type: string
      description: A cursor for use in pagination. `ending_before` is an object ID that defines your place in the list.

paths:
  # ── Payments ──────────────────────────────────────────────────────
  /payments:
    post:
      operationId: createPayment
      summary: Create a payment
      description: |
        Creates a new payment object. To be used when you intend to create a payment and accept
        payment in a single call. If you want to authorize and capture payment separately, set
        `capture_method` to `manual`.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  description: Amount intended to be collected by this payment, in the smallest currency unit.
                  example: 2000
                currency:
                  type: string
                  description: Three-letter ISO currency code, in lowercase.
                  example: usd
                customer:
                  type: string
                  description: ID of the customer this payment is intended for, if one exists.
                payment_method:
                  type: string
                  description: ID of the payment method to attach to this payment.
                capture_method:
                  type: string
                  enum: [automatic, manual]
                  default: automatic
                  description: Controls when the funds will be captured.
                description:
                  type: string
                  description: An arbitrary string attached to the object. Often useful for displaying to users.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: Set of key-value pairs for storing additional structured information.
                receipt_email:
                  type: string
                  description: Email address that the receipt for the resulting payment will be sent to.
      responses:
        "200":
          description: Returns a payment object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid API key provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: listPayments
      summary: List all payments
      description: Returns a list of payments. Payments are sorted by creation date, with the most recent payments appearing first.
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: customer
          in: query
          schema:
            type: string
          description: Only return payments for the customer specified by this customer ID.
        - name: created
          in: query
          schema:
            type: integer
          description: Only return payments created during the given date interval (Unix timestamp).
      responses:
        "200":
          description: A dictionary with a `data` property that contains an array of payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Payment"

  /payments/{id}:
    get:
      operationId: retrievePayment
      summary: Retrieve a payment
      description: Retrieves the details of a payment that has previously been created.
      tags: [Payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The identifier of the payment to retrieve.
      responses:
        "200":
          description: Returns a payment object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Capture a payment
      description: |
        Capture the funds of an existing uncaptured payment created with `capture_method: manual`.
        You can only capture up to the amount of the original payment. Pass an `amount_to_capture`
        to capture less than the full amount.
      tags: [Payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_to_capture:
                  type: integer
                  description: The amount to capture from the payment. Defaults to the full `amount`.
      responses:
        "200":
          description: Returns a payment object with status `succeeded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment
      description: |
        A payment that is not yet captured can be canceled. Canceling a payment voids the
        authorization and does not trigger any application fee refunds.
      tags: [Payments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a payment object with status `canceled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # ── Customers ─────────────────────────────────────────────────────
  /customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: Creates a new customer object. You may optionally provide a payment method to attach to the customer.
      tags: [Customers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Customer's email address. Displayed alongside the customer in the Dashboard and included in receipts.
                  example: jenny.rosen@example.com
                name:
                  type: string
                  description: The customer's full name or business name.
                  example: Jenny Rosen
                phone:
                  type: string
                  description: The customer's phone number.
                description:
                  type: string
                  description: An arbitrary string that you can attach to a customer object.
                payment_method:
                  type: string
                  description: The ID of the payment method to attach to the customer.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns a customer object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    get:
      operationId: listCustomers
      summary: List all customers
      description: Returns a list of your customers.
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: email
          in: query
          schema:
            type: string
          description: A case-sensitive filter on the list based on the customer's email field.
      responses:
        "200":
          description: A dictionary with a `data` property that contains an array of customers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: retrieveCustomer
      summary: Retrieve a customer
      description: Retrieves a Customer object.
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a customer object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    post:
      operationId: updateCustomer
      summary: Update a customer
      description: Updates the specified customer by setting the values of the parameters passed.
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                description:
                  type: string
                default_payment_method:
                  type: string
                  description: ID of a payment method to set as the customer's default payment method.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns the customer object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    delete:
      operationId: deleteCustomer
      summary: Delete a customer
      description: Permanently deletes a customer. It cannot be undone.
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns an object with a deleted parameter on success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    enum: [customer]
                  deleted:
                    type: boolean
                    enum: [true]

  # ── Payment Methods ────────────────────────────────────────────────
  /payment-methods:
    post:
      operationId: createPaymentMethod
      summary: Create a payment method
      description: Creates a new payment method object. Payment methods allow you to collect payment information from a customer.
      tags: [Payment Methods]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [card, sepa_debit, us_bank_account]
                  description: The type of the payment method.
                card:
                  type: object
                  description: If this is a card payment method, this field contains card details.
                  properties:
                    number:
                      type: string
                      description: The card number, as a string without any separators.
                      example: "4242424242424242"
                    exp_month:
                      type: integer
                      description: Two-digit number representing the card's expiration month.
                      example: 12
                    exp_year:
                      type: integer
                      description: Four-digit number representing the card's expiration year.
                      example: 2026
                    cvc:
                      type: string
                      description: Card security code.
                      example: "314"
                billing_details:
                  type: object
                  properties:
                    email:
                      type: string
                    name:
                      type: string
                    phone:
                      type: string
      responses:
        "200":
          description: Returns a payment method object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

    get:
      operationId: listPaymentMethods
      summary: List payment methods
      description: Returns a list of payment methods attached to the customer specified.
      tags: [Payment Methods]
      parameters:
        - name: customer
          in: query
          required: true
          schema:
            type: string
          description: The ID of the customer whose payment methods will be retrieved.
        - name: type
          in: query
          schema:
            type: string
            enum: [card, sepa_debit, us_bank_account]
          description: An optional filter on the list, based on the object `type` field.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: A dictionary with a `data` property that contains an array of payment methods.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaymentMethod"

  /payment-methods/{id}:
    get:
      operationId: retrievePaymentMethod
      summary: Retrieve a payment method
      description: Retrieves a payment method object attached to the specified customer.
      tags: [Payment Methods]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a payment method object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /payment-methods/{id}/attach:
    post:
      operationId: attachPaymentMethod
      summary: Attach a payment method to a customer
      description: Attaches a payment method object to a customer. To attach a new payment method to a customer for future payments, we recommend you use a SetupIntent.
      tags: [Payment Methods]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer]
              properties:
                customer:
                  type: string
                  description: The ID of the customer to which to attach the payment method.
      responses:
        "200":
          description: Returns a payment method object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /payment-methods/{id}/detach:
    post:
      operationId: detachPaymentMethod
      summary: Detach a payment method from a customer
      description: Detaches a payment method object from a customer. After a payment method is detached, it can no longer be used for a payment or re-attached to a customer.
      tags: [Payment Methods]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the detached payment method object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  # ── Subscriptions ──────────────────────────────────────────────────
  /subscriptions:
    post:
      operationId: createSubscription
      summary: Create a subscription
      description: Creates a new subscription on an existing customer.
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, items]
              properties:
                customer:
                  type: string
                  description: The identifier of the customer to subscribe.
                items:
                  type: array
                  description: A list of up to 20 subscription items, each with an attached price.
                  items:
                    type: object
                    required: [price]
                    properties:
                      price:
                        type: string
                        description: The ID of the price to subscribe to.
                      quantity:
                        type: integer
                        default: 1
                        description: Quantity of the plan to which the customer should subscribe.
                trial_period_days:
                  type: integer
                  description: Integer representing the number of trial period days before the customer is charged for the first time.
                cancel_at_period_end:
                  type: boolean
                  default: false
                  description: Boolean indicating whether this subscription should cancel at the end of the current period.
                default_payment_method:
                  type: string
                  description: ID of the default payment method for the subscription.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns a subscription object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

    get:
      operationId: listSubscriptions
      summary: List all subscriptions
      description: By default, returns a list of subscriptions that have not been canceled.
      tags: [Subscriptions]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: customer
          in: query
          schema:
            type: string
          description: The ID of the customer whose subscriptions will be retrieved.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, past_due, canceled, unpaid, incomplete, incomplete_expired, trialing, all]
          description: The status of the subscriptions to retrieve.
      responses:
        "200":
          description: Returns a list of subscription objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    get:
      operationId: retrieveSubscription
      summary: Retrieve a subscription
      description: Retrieves the subscription with the given ID.
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the subscription object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

    post:
      operationId: updateSubscription
      summary: Update a subscription
      description: Updates an existing subscription. When you update a subscription, we will immediately attempt to collect payment if applicable.
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_at_period_end:
                  type: boolean
                  description: Boolean indicating whether this subscription should cancel at the end of the current period.
                default_payment_method:
                  type: string
                  description: ID of the default payment method for the subscription.
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Subscription item to update.
                      price:
                        type: string
                        description: The ID of the price object.
                      quantity:
                        type: integer
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns the updated subscription object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

    delete:
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: Cancels a customer's subscription immediately. The customer will not be charged again for the subscription.
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Returns the canceled subscription object with `status: canceled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  # ── Invoices ───────────────────────────────────────────────────────
  /invoices:
    post:
      operationId: createInvoice
      summary: Create an invoice
      description: This endpoint creates a draft invoice for a given customer. The draft invoice created pulls in all pending invoice items on that customer.
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer]
              properties:
                customer:
                  type: string
                  description: The ID of the customer who will be billed.
                auto_advance:
                  type: boolean
                  default: true
                  description: Controls whether Vinr performs automatic collection of the invoice.
                collection_method:
                  type: string
                  enum: [charge_automatically, send_invoice]
                  default: charge_automatically
                days_until_due:
                  type: integer
                  description: Number of days a customer has to pay the invoice, if `collection_method` is `send_invoice`.
                description:
                  type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns the invoice object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

    get:
      operationId: listInvoices
      summary: List all invoices
      description: You can list all invoices, or list the invoices for a specific customer.
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: customer
          in: query
          schema:
            type: string
          description: Only return invoices for the customer specified by this customer ID.
        - name: subscription
          in: query
          schema:
            type: string
          description: Only return invoices for the subscription specified by this subscription ID.
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, open, paid, uncollectible, void]
          description: The status of the invoice, one of `draft`, `open`, `paid`, `uncollectible`, or `void`.
      responses:
        "200":
          description: Returns a list of invoice objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: retrieveInvoice
      summary: Retrieve an invoice
      description: Retrieves the invoice with the given ID.
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the invoice object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/finalize:
    post:
      operationId: finalizeInvoice
      summary: Finalize an invoice
      description: Finalizes a draft invoice and transitions it to `open`. Once finalized, you can no longer delete an invoice.
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Returns the finalized invoice object with `status: open`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/pay:
    post:
      operationId: payInvoice
      summary: Pay an invoice
      description: Pays an invoice, resulting in the invoice being closed and the payment recorded.
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  type: string
                  description: ID of the payment method to charge. Defaults to the customer's default payment method.
      responses:
        "200":
          description: Returns the paid invoice object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/void:
    post:
      operationId: voidInvoice
      summary: Void an invoice
      description: Mark a finalized invoice as void. Voiding an invoice is functionally the same as deleting it.
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the voided invoice object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  # ── Refunds ────────────────────────────────────────────────────────
  /refunds:
    post:
      operationId: createRefund
      summary: Create a refund
      description: When you create a new refund, you must specify either a payment or a charge.
      tags: [Refunds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment]
              properties:
                payment:
                  type: string
                  description: The identifier of the payment to be refunded.
                amount:
                  type: integer
                  description: A positive integer representing how much to refund. Defaults to the full amount of the payment.
                reason:
                  type: string
                  enum: [duplicate, fraudulent, requested_by_customer]
                  description: The reason for the refund.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns a refund object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"

    get:
      operationId: listRefunds
      summary: List all refunds
      description: Returns a list of all refunds you've previously created.
      tags: [Refunds]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: payment
          in: query
          schema:
            type: string
          description: Only return refunds for the payment specified by this payment ID.
      responses:
        "200":
          description: Returns a list of refund objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Refund"

  /refunds/{id}:
    get:
      operationId: retrieveRefund
      summary: Retrieve a refund
      description: Retrieves the details of an existing refund.
      tags: [Refunds]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a refund object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"

  # ── Payouts ────────────────────────────────────────────────────────
  /payouts:
    post:
      operationId: createPayout
      summary: Create a payout
      description: To send funds to your own bank account, you create a new payout object.
      tags: [Payouts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  description: A positive integer representing how much to pay out in the smallest currency unit.
                currency:
                  type: string
                  description: Three-letter ISO currency code, in lowercase.
                method:
                  type: string
                  enum: [standard, instant]
                  default: standard
                  description: The method used to send this payout. `instant` is only supported for payouts to debit cards.
                description:
                  type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns a payout object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

    get:
      operationId: listPayouts
      summary: List all payouts
      description: Returns a list of existing payouts sent to third-party bank accounts or that Vinr has sent you.
      tags: [Payouts]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, pending, in_transit, canceled, failed]
          description: Only return payouts that have the given status.
      responses:
        "200":
          description: Returns a list of payout objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Payout"

  /payouts/{id}:
    get:
      operationId: retrievePayout
      summary: Retrieve a payout
      description: Retrieves the details of an existing payout.
      tags: [Payouts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a payout object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  /payouts/{id}/cancel:
    post:
      operationId: cancelPayout
      summary: Cancel a payout
      description: A previously created payout can be canceled if it has not yet been paid out.
      tags: [Payouts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the payout object with status `canceled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"

  # ── Disputes ───────────────────────────────────────────────────────
  /disputes:
    get:
      operationId: listDisputes
      summary: List all disputes
      description: Returns a list of your disputes.
      tags: [Disputes]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: payment
          in: query
          schema:
            type: string
          description: Only return disputes associated with the payment specified by this payment ID.
      responses:
        "200":
          description: Returns a list of dispute objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Dispute"

  /disputes/{id}:
    get:
      operationId: retrieveDispute
      summary: Retrieve a dispute
      description: Retrieves the dispute with the given ID.
      tags: [Disputes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a dispute object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

    post:
      operationId: updateDispute
      summary: Update a dispute
      description: When you get a dispute, contacting your customer is always the best first step. If that doesn't work, you can submit evidence to help us resolve the dispute in your favor.
      tags: [Disputes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                evidence:
                  type: object
                  properties:
                    customer_email_address:
                      type: string
                    customer_name:
                      type: string
                    customer_purchase_ip:
                      type: string
                    product_description:
                      type: string
                    receipt:
                      type: string
                    shipping_documentation:
                      type: string
                submit:
                  type: boolean
                  description: Whether to immediately submit evidence to the bank.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns the dispute object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

  # ── Webhook Endpoints ─────────────────────────────────────────────
  /webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Create a webhook endpoint
      description: A webhook endpoint must have a `url` and a list of `enabled_events`. You may optionally specify the Boolean `connect` parameter.
      tags: [Webhook Endpoints]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, enabled_events]
              properties:
                url:
                  type: string
                  description: The URL of the webhook endpoint.
                  example: https://example.com/webhooks
                enabled_events:
                  type: array
                  items:
                    type: string
                  description: The list of events to enable for this endpoint. Specify `['*']` to enable all events.
                  example: ["payment.succeeded", "payment.failed"]
                description:
                  type: string
                  description: An optional description of what the webhook is used for.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns the webhook endpoint object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"

    get:
      operationId: listWebhookEndpoints
      summary: List all webhook endpoints
      description: Returns a list of your webhook endpoints.
      tags: [Webhook Endpoints]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Returns a list of webhook endpoint objects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookEndpoint"

  /webhook-endpoints/{id}:
    get:
      operationId: retrieveWebhookEndpoint
      summary: Retrieve a webhook endpoint
      description: Retrieves the webhook endpoint with the given ID.
      tags: [Webhook Endpoints]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns a webhook endpoint object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"

    post:
      operationId: updateWebhookEndpoint
      summary: Update a webhook endpoint
      description: Updates the webhook endpoint. You may edit the `url`, the list of `enabled_events`, and the status of your endpoint.
      tags: [Webhook Endpoints]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                enabled_events:
                  type: array
                  items:
                    type: string
                disabled:
                  type: boolean
                  description: Disable the webhook endpoint if set to `true`.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Returns the updated webhook endpoint object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"

    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      description: You can also delete webhook endpoints via the webhook endpoint management page of the Dashboard.
      tags: [Webhook Endpoints]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns an object with a deleted parameter on success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    enum: [webhook_endpoint]
                  deleted:
                    type: boolean
                    enum: [true]
